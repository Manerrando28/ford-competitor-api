spring.application.name=ford-competitor-api

# Base de Dados H2 em Memoria
spring.datasource.url=jdbc:h2:mem:forddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console da Base de Dados H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: em produção, informe JWT_SECRET e JWT_EXPIRATION_MS como variáveis de ambiente.
# O valor padrão existe somente para facilitar a execução local da entrega.
jwt.secret=${JWT_SECRET:9a6e8b12c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
